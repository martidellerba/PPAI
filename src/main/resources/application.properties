spring.application.name=ppai-seguimiento-bolsines
server.port=8081
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ppai_bolsines}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
gps.xtr4500l.base-url=http://localhost:8080
gps.xtr4500l.api-key=${GPS_XTR_API_KEY:}
maps.google.api-key=${GOOGLE_MAPS_API_KEY:}
mail.graph.tenant-id=${MAIL_GRAPH_TENANT_ID:}
mail.graph.client-id=${MAIL_GRAPH_CLIENT_ID:}
mail.graph.client-secret=${MAIL_GRAPH_CLIENT_SECRET:}
mail.graph.sender-email=${MAIL_GRAPH_SENDER_EMAIL:}
