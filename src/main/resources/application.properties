spring.application.name=ppai-seguimiento-bolsines
server.port=8081
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=strict
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ppai_bolsines}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
gps.xtr4500l.base-url=http://localhost:8080
gps.xtr4500l.api-key=${GPS_XTR_API_KEY:}
maps.google.api-key=${GOOGLE_MAPS_API_KEY:}
